<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipo con Futuro 333</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --azul:#1F6DB1;--azul-claro:#D1E3F6;--naranja:#E87722;--gris:#53565A;--verde:#8CC63F;
  --bg:#F4F8FC;--surface:#FFFFFF;--ink:#1B2A3A;--muted:#53565A;--line:#D1E3F6;--track:#EAF1F9;--prev:#A9C8E8;
  --hero:#1F6DB1;--hero-ink:#FFFFFF;--hero-muted:#D1E3F6;--good:#5E9A1E;--bad:#E87722;--warn:#E87722;--chip:#FFFFFF;
  --body:"Montserrat",system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:grid;gap:18px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}.logo{width:110px;height:auto}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font:700 26px/1.15 var(--body);margin:6px 0 0}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:500 12px/1.2 var(--body)}
.chip .d0{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.live .d0{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.chip.warn .d0{background:var(--warn)}.chip.err .d0{background:var(--bad)}
button{font:600 12px/1 var(--body);border:1px solid var(--azul);background:var(--surface);color:var(--azul);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{background:var(--azul);color:#fff}#login{background:var(--azul);color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:24px;
  background-image:linear-gradient(120deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.1) 55%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.2) 70%)}
.hero .eyebrow{color:var(--hero-muted)}
.big{font:700 clamp(40px,7vw,64px)/1 var(--body);letter-spacing:-.02em;margin:10px 0 8px;font-variant-numeric:tabular-nums}
.big small{font:500 16px var(--body);color:var(--hero-muted);letter-spacing:0;margin-left:6px}
.hero p{margin:0;color:var(--hero-muted);max-width:60ch}
.hchg{display:inline-block;margin-left:12px;font:700 16px var(--body);background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font:700 20px/1.25 var(--body);margin-top:6px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}.eq{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font:700 15px/1.3 var(--body);margin:0 0 2px}
.panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.chart{position:relative;height:430px}
.years{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.years button{border-radius:999px;padding:8px 16px;font-weight:600}
.years button[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
details.more{border-top:1px solid var(--line)}
.moresum{grid-template-columns:24px 1fr!important;padding:2px 0!important}
.moresum .sub{color:var(--muted);font-size:12px}
details.more[open] .moresum{margin-bottom:8px}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:24px 1fr 44px 64px;gap:10px;align-items:center;padding:10px 0}
summary::-webkit-details-marker{display:none}
.plus{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--azul);color:var(--azul);display:grid;place-items:center;font-weight:700;line-height:1}
details[open] .plus{background:var(--azul);color:#fff}
details[open] .plus::after{content:"−"}details:not([open]) .plus::after{content:"+"}
.nm{font-weight:600}
.val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.val.low{color:var(--bad)}
.chg{text-align:right;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.items{padding:0 0 10px 34px}
.row{display:grid;grid-template-columns:1fr 44px 64px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.bars{display:grid;gap:3px;margin-top:4px}
.bars span{display:block;height:6px;border-radius:3px}
.bars .p{background:var(--prev)}.bars .n{background:var(--azul)}.bars .n.low{background:var(--naranja)}
.msg{font-size:12px;color:var(--muted);margin:0}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.logo{width:100px}.chart{height:380px}}
@media (max-width:420px){.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
const CONFIG={
  tenantId:"a7f469f2-8d30-43b8-bcef-a8d83aa54321",
  clientId:"7941b150-5955-4a1b-b981-77b41176bafe",
  archivo:"Equipo_con_Futuro_333.xlsx",
  driveId:"", itemId:"",             // opcional: si se completan, no busca por nombre
  scopes:["Files.Read.All"],
  refreshMs:600000
};
const BASE=JSON.parse(document.getElementById('data').textContent);
const ITEMS=BASE.items,DIMS=[...new Set(ITEMS.map(x=>x.d))];
let S={olas:BASE.olas,th:BASE.th};
const $=id=>document.getElementById(id);
const nf=v=>v==null||isNaN(v)?'—':v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const n1=v=>v.toLocaleString('es-AR',{maximumFractionDigits:1});
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mean=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const agg=(o,d)=>mean(ITEMS.map((x,i)=>d==null||x.d===d?o.items[i].p:null));
const cls=dl=>dl==null?'eq':dl>=S.th.delta?'pos':dl<=-S.th.delta?'neg':'eq';
const chg=dl=>dl==null?'<span class="eq">—</span>':`<span class="${cls(dl)}">${cls(dl)==='pos'?'▲ ':cls(dl)==='neg'?'▼ ':''}${(dl>0?'+':'')+nf(dl)}</span>`;
const w=v=>v==null?0:Math.max(0,(v-1)/4*100);
let ch=null,SEL=null;
const FONT='"Montserrat", system-ui, Arial, sans-serif';
if(window.Chart){Chart.defaults.font.family=FONT;Chart.defaults.color=css('--muted');}
function ramp(n){const a=[209,227,246],b=[31,109,177];return Array.from({length:n},(_,i)=>{const r=n===1?1:i/(n-1);return '#'+a.map((x,j)=>Math.round(x+(b[j]-x)*r).toString(16).padStart(2,'0')).join('')})}

const minLine={id:'minLine',afterDatasetsDraw(c){const x=c.scales.x;if(!x)return;const px=x.getPixelForValue(S.th.min),a=c.chartArea,g=c.ctx;
  g.save();g.strokeStyle=css('--naranja');g.lineWidth=2;g.setLineDash([4,3]);g.beginPath();g.moveTo(px,a.top);g.lineTo(px,a.bottom);g.stroke();
  g.setLineDash([]);g.fillStyle=css('--naranja');g.font='600 11px '+FONT;g.textAlign='center';g.fillText('mín. '+n1(S.th.min),px,a.top-6);g.restore();}};
const endLbl={id:'endLbl',afterDatasetsDraw(c){const g=c.ctx;const last=c.data.datasets.length-1;const m=c.getDatasetMeta(last);
  g.save();g.font='700 11px '+FONT;g.fillStyle=css('--ink');g.textBaseline='middle';
  m.data.forEach((b,i)=>{const v=c.data.datasets[last].data[i];if(v!=null)g.fillText(nf(v),b.x+5,b.y)});g.restore();}};

function pills(){
 if(!SEL||SEL.size===0||[...SEL].some(i=>i>=S.olas.length))SEL=new Set(S.olas.map((_,i)=>i).slice(-4));
 const y=$('years');y.hidden=S.olas.length<2;
 y.innerHTML='<span class="sub" style="align-self:center;margin:0">Comparar:</span>'+S.olas.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${SEL.has(i)}">${o.name}</button>`).join('');
 y.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(SEL.has(i)){if(SEL.size>1)SEL.delete(i)}else SEL.add(i);render()});
}
function render(){
 pills();
 const V=S.olas.filter((_,i)=>SEL.has(i));
 const n=V.length,ob=V[n-1],oa=n>1?V[n-2]:null;
 const gb=agg(ob),ga=oa?agg(oa):null;
 $('heroEye').textContent=`Índice general del equipo · ${ob.name}`;
 $('heroVal').textContent=nf(gb);
 const hc=$('heroChg');if(oa){const dl=gb-ga;hc.hidden=false;hc.textContent=(dl>=S.th.delta?'▲ ':dl<=-S.th.delta?'▼ ':'')+(dl>0?'+':'')+nf(dl)+' vs '+oa.name}else hc.hidden=true;
 $('heroTxt').textContent=oa?`Promedio de las 8 dimensiones, escala 1 a 5. Cambios menores a ±${n1(S.th.delta)} se consideran estables.`:`Promedio de las 8 dimensiones, escala 1 a 5. Línea base; próxima medición: ${BASE.next||'septiembre 2026'}.`;
 $('heroHist').textContent=n>1?'Evolución: '+V.map(o=>`${o.name} ${nf(agg(o))}`).join('  ·  '):'';
 const dims=DIMS.map(d=>({d,b:agg(ob,d),a:oa?agg(oa,d):null}));
 const low=ob.items.filter(x=>x.p!=null&&x.p<S.th.min).length;
 const k=(e,v,s)=>`<div class="kpi"><div class="eyebrow">${e}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 let h;
 if(oa){const s=[...dims].sort((x,y)=>(y.b-y.a)-(x.b-x.a));h=k('Más subió',s[0].d,chg(s[0].b-s[0].a))+k('Más bajó',s[s.length-1].d,chg(s[s.length-1].b-s[s.length-1].a))}
 else{const s=[...dims].sort((x,y)=>y.b-x.b),l=s[s.length-1];h=k('Dimensión más fuerte',s[0].d,nf(s[0].b))+k('Dimensión más débil',l.d,`<span class="${l.b<S.th.min?'neg':''}">${nf(l.b)}</span>`)}
 h+=k('Bajo el mínimo',`${low} de ${ITEMS.length}`,`preguntas debajo de ${n1(S.th.min)}`)+k('Participantes',ob.n??'—',oa&&oa.n?`${oa.n} en ${oa.name}`:'personas que respondieron');
 $('kpis').innerHTML=h;
 // gráfico de barras
 $('chartSub').textContent=n>1?`Cada color es una medición, la más oscura es la última elegida · Línea naranja: mínimo esperado`:`Promedio por dimensión en ${ob.name} · Línea naranja: mínimo esperado`;
 const cols=ramp(n);
 const ds=V.map((o,i)=>({label:o.name,data:DIMS.map(d=>agg(o,d)),borderRadius:3,barPercentage:.92,categoryPercentage:.8,
   backgroundColor:i===n-1?DIMS.map(d=>agg(o,d)<S.th.min?css('--naranja'):cols[i]):cols[i]}));
 $('c1').parentElement.style.height=Math.max(430,8*(n*14+22)+90)+'px';
 if(ch)ch.destroy();
 if(window.Chart)ch=new Chart($('c1'),{type:'bar',data:{labels:DIMS,datasets:ds},plugins:[minLine,endLbl],
  options:{indexAxis:'y',maintainAspectRatio:false,animation:false,layout:{padding:{top:16,right:40}},
   scales:{x:{min:1,max:5,ticks:{stepSize:1,color:css('--muted'),font:{family:FONT,size:11}},grid:{color:css('--line')}},
           y:{ticks:{color:css('--ink'),font:{family:FONT,size:12,weight:'600'}},grid:{display:false}}},
   plugins:{legend:{display:n>1,position:'bottom',labels:{color:css('--ink'),font:{family:FONT,size:11},boxWidth:14}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${nf(c.raw)}`}}}}});
 // detalle
 $('list').innerHTML=dims.map(({d,a,b})=>{
  const rows=ITEMS.map((x,i)=>[x,i]).filter(([x])=>x.d===d).map(([x,i])=>{const pb=ob.items[i].p,pa=oa?oa.items[i].p:null;
   return `<div class="row"><div>${x.i}<div class="bars">${V.map((o,j)=>{const v=o.items[i].p;return j===n-1?`<span class="n ${v!=null&&v<S.th.min?'low':''}" style="width:${w(v)}%"></span>`:`<span style="width:${w(v)}%;background:${cols[j]}" title="${o.name}: ${nf(v)}"></span>`}).join('')}</div></div><span class="val ${pb!=null&&pb<S.th.min?'low':''}">${nf(pb)}</span><span class="chg">${chg(pa!=null&&pb!=null?pb-pa:null)}</span></div>`}).join('');
  return `<details><summary><span class="plus" aria-hidden="true"></span><span class="nm">${d}</span><span class="val ${b<S.th.min?'low':''}">${nf(b)}</span><span class="chg">${chg(a!=null?b-a:null)}</span></summary><div class="items">${rows}</div></details>`}).join('');
}

// ---- lectura en vivo del Excel (misma conexión que RPE y Rotación)
function setChip(c,t){$('chip').className='chip '+c;$('chipText').textContent=t}
let pca=null,account=null,timer=null;
async function token(){const req={scopes:CONFIG.scopes,account};
 try{return(await pca.acquireTokenSilent(req)).accessToken}catch(e){await pca.acquireTokenRedirect(req);throw e}}
async function g(url,t,opts){const r=await fetch(url,Object.assign({headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}},opts||{}));
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));return r.json()}
async function ubicar(t){
 if(CONFIG.driveId&&CONFIG.itemId)return{driveId:CONFIG.driveId,itemId:CONFIG.itemId};
 const body={requests:[{entityTypes:['driveItem'],query:{queryString:CONFIG.archivo},from:0,size:10}]};
 const j=await g('https://graph.microsoft.com/v1.0/search/query',t,{method:'POST',body:JSON.stringify(body)});
 for(const hc of((j.value||[])[0]||{}).hitsContainers||[])for(const h of(hc.hits||[])){const res=h.resource||{};
  if((res.name||'').toLowerCase()===CONFIG.archivo.toLowerCase())return{driveId:(res.parentReference||{}).driveId,itemId:res.id}}
 throw new Error('no encontrado')}
const num=v=>typeof v==='number'?v:(v===''||v==null||isNaN(+v)?null:+v);
function procesar(cfg,hojas){
 const th={min:num(cfg[16]?.[4])||3.8,delta:num(cfg[17]?.[4])||0.4,fav:num(cfg[18]?.[4])||0.7};const olas=[];
 for(let k=3;k<cfg.length&&k<15&&num(cfg[k]?.[0])!=null;k++){
  const[,name,,sheet,sessRaw]=cfg[k];const vals=hojas[sheet];if(!vals)continue;const sess=num(sessRaw);
  const rows=vals.slice(3).filter(rw=>sess==null||num(rw[1])===sess);
  const items=ITEMS.map((_,i)=>{const v=rows.map(rw=>num(rw[4+i])).filter(x=>x!=null);return v.length?{p:v.reduce((s,x)=>s+x,0)/v.length,f:v.filter(x=>x>=4).length/v.length,n:v.length}:{p:null,f:null,n:0}});
  if(items.every(x=>x.n===0))continue;
  olas.push({name:name||sheet,n:rows.filter(rw=>num(rw[2])!=null).length,items});}
 return{olas,th}}
async function leer(){
 if(!account)return;setChip('warn','Leyendo el Excel…');
 try{
  const t=await token(),loc=await ubicar(t);
  const base=`https://graph.microsoft.com/v1.0/drives/${loc.driveId}/items/${loc.itemId}/workbook/worksheets`;
  const cfg=(await g(`${base}('Olas')/range(address='A1:G40')?$select=values`,t)).values||[];
  const sheets=[];for(let k=3;k<cfg.length&&k<15&&num(cfg[k]?.[0])!=null;k++)if(cfg[k][3])sheets.push(cfg[k][3]);
  const res=await Promise.all(sheets.map(s=>g(`${base}('${encodeURIComponent(s)}')/range(address='A1:AR300')?$select=values`,t).then(j=>[s,j.values||[]]).catch(()=>[s,null])));
  const out=procesar(cfg,Object.fromEntries(res.filter(([,v])=>v)));
  if(!out.olas.length)throw new Error('sin datos');
  S=out;render();
  setChip('live','En vivo · leído '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}));$('msg').textContent='';
 }catch(e){const m=String(e.message||e);setChip('err','No se pudo leer el Excel');
  $('msg').textContent=m.includes('no encontrado')?`No encontré "${CONFIG.archivo}" en SharePoint. Subilo o revisá el nombre.`
   :m.startsWith('403')?'Tu usuario no tiene acceso al archivo, o falta el permiso Files.Read.All.'
   :m.startsWith('401')?'La sesión venció. Tocá Actualizar.':m.includes('sin datos')?'El Excel no tiene respuestas cargadas.':'Error al leer: '+m;}
}
async function iniciar(){
 $('login').hidden=true;
 if(!window.msal){setChip('warn','Copia al 21/09 · no cargó el inicio de sesión');return}
 pca=new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:'https://login.microsoftonline.com/'+CONFIG.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
 try{const r=await pca.handleRedirectPromise();if(r&&r.account)account=r.account}catch(e){}
 account=account||pca.getAllAccounts()[0]||null;
 if(!account){setChip('warn','Copia al 21/09 · iniciá sesión para ver en vivo');$('login').hidden=false;return}
 leer();clearInterval(timer);timer=setInterval(leer,CONFIG.refreshMs);
}
$('login').addEventListener('click',()=>pca.loginRedirect({scopes:CONFIG.scopes}));
$('refresh').addEventListener('click',()=>{account?leer():iniciar()});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
try{iniciar()}catch(e){setChip('warn','Copia al 21/09')}
})();
</script>
