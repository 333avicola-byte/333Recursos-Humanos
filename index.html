<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI RRHH 333</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<style>
:root{
  --azul:#1F6DB1; --azul-2:#2D85D1; --claro:#D1E3F6; --naranja:#E87722; --verde:#8CC63F; --gris:#53565A;
  --ink:#0E1B2B; --muted:#6B7480; --bg:#FBFBFD; --tile:#F2F5F9; --line:rgba(14,27,43,.08);
  --f:"Montserrat",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* NAV vidrio */
nav{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;justify-content:center;
  background:rgba(251,251,253,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.nav-in{width:min(1024px,100%);padding:0 22px;display:flex;align-items:center;gap:28px}
.nav-in img{height:26px;width:auto}
.nav-in .t{font-weight:600;font-size:14px;letter-spacing:-.01em;margin-right:auto}
.nav-in .links{display:flex;gap:26px;font-size:12px;color:var(--muted)}
.nav-in .links a:hover{color:var(--ink)}
@media (max-width:700px){.nav-in .links{display:none}}

/* HERO */
.hero{height:135vh;position:relative}
.hero-stick{position:sticky;top:52px;height:calc(100vh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;overflow:hidden}
.eyebrow{font-size:14px;font-weight:600;color:var(--naranja);letter-spacing:.02em;margin-bottom:14px}
.hero h1{font-size:clamp(44px,8.5vw,112px);font-weight:700;letter-spacing:-.045em;line-height:1.02;
  background:linear-gradient(180deg,var(--ink) 30%,#3a4b60);-webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform,opacity}
.hero h1 span{background:linear-gradient(90deg,var(--azul),var(--azul-2) 60%,#63A6E0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:22px;font-size:clamp(17px,2vw,24px);font-weight:400;color:var(--muted);max-width:30ch;line-height:1.35;letter-spacing:-.01em}
.hero .cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:980px;font-size:15px;font-weight:500;transition:transform .2s,background .2s}
.btn.pri{background:var(--azul);color:#fff}
@media (hover:hover){.btn.pri:hover{background:#185a93;transform:scale(1.03)}}
.btn,.rail a,.vis{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.sec{color:var(--azul)}.btn.sec:hover{text-decoration:underline}
.orb{position:absolute;width:62vmax;height:62vmax;border-radius:50%;z-index:-1;filter:blur(60px);opacity:.55;
  background:radial-gradient(circle at 30% 30%,var(--claro),transparent 60%),radial-gradient(circle at 70% 70%,rgba(45,133,209,.25),transparent 55%)}
.scroll-cue{position:absolute;bottom:34px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.scroll-cue::after{content:"";display:block;margin:10px auto 0;width:1px;height:34px;background:linear-gradient(var(--muted),transparent);animation:cue 2s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* SECCIONES por herramienta */
.tool{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 22px}
.tool:nth-of-type(even){background:var(--tile)}
.tool-in{width:min(1024px,100%);display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.tool:nth-of-type(odd) .tool-in .vis{order:-1}
.num{font-size:13px;font-weight:600;color:var(--naranja);letter-spacing:.06em;text-transform:uppercase}
.tool h2{font-size:clamp(38px,5.4vw,68px);font-weight:700;letter-spacing:-.04em;line-height:1.03;margin:12px 0 18px}
.tool p{font-size:clamp(17px,1.6vw,21px);color:var(--muted);line-height:1.45;max-width:34ch;letter-spacing:-.01em}
.tool .src{margin-top:18px;font-size:12px;font-weight:600;color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.tool .btn{margin-top:30px}
.vis{aspect-ratio:1/1;border-radius:32px;background:#fff;box-shadow:0 30px 80px -30px rgba(14,27,43,.25);display:flex;align-items:center;justify-content:center;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tool:nth-of-type(even) .vis{background:var(--bg)}
.vis svg{width:88%;height:auto;overflow:visible}
.vis{background:radial-gradient(120% 90% at 20% 10%,#EAF2FB 0%,#F7FAFD 55%,#fff 100%)!important;position:relative;overflow:hidden}
.vis::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(31,109,177,.08);pointer-events:none}
.fade{opacity:0;transition:opacity 1.4s .6s}.in .fade{opacity:1}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s 1.6s cubic-bezier(.3,1.6,.5,1)}.in .pop{transform:scale(1)}
.float{animation:flt 6s ease-in-out infinite}.float.d2{animation-delay:-3s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:820px){.tool{min-height:auto;padding:88px 20px}.tool-in{grid-template-columns:1fr;gap:34px}.tool:nth-of-type(odd) .tool-in .vwrap{order:0}.vis{width:100%;border-radius:26px}.vwrap{max-width:460px;justify-self:center}.tool p{max-width:none}}
@media (max-width:420px){.vis svg{width:96%}.tool h2{font-size:40px}}


/* ===== ESCENAS tipo keynote para cada indicador ===== */
.stage{width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.vwrap{width:100%}
.tool:nth-of-type(odd) .tool-in .vwrap{order:-1}
.bignum{display:none}
.rail{display:none}
body.cine .tool{display:block;min-height:0;height:190vh;padding:0;background:transparent!important}
body.cine .stage{position:sticky;top:52px;height:calc(100vh - 52px);overflow:hidden;padding:0 22px}
.halo{display:none}
body.cine .halo{display:block;position:absolute;inset:0;z-index:-2;opacity:0;will-change:opacity;pointer-events:none;
  background:radial-gradient(70% 60% at 72% 45%,#E4EFFA 0%,rgba(228,239,250,0) 70%)}
body.cine .tool:nth-of-type(odd) .halo{background:radial-gradient(70% 60% at 28% 45%,#E4EFFA 0%,rgba(228,239,250,0) 70%)}
body.cine .vwrap,body.cine .k2,body.cine .k3,body.cine .k4,body.cine .k5{will-change:transform,opacity}
body.cine .vis{box-shadow:0 50px 120px -40px rgba(14,27,43,.35)}
body.cine .k5{display:inline-flex}
body.cine .rail{display:flex;position:fixed;right:28px;top:50%;transform:translateY(-50%);flex-direction:column;gap:14px;z-index:40;
  padding:12px 9px;border-radius:999px;background:rgba(251,251,253,.6);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 0 0 1px rgba(14,27,43,.06);opacity:0;transition:opacity .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.cine .rail.on{opacity:1;pointer-events:auto}
.rail a{display:block;width:8px;height:8px;position:relative;z-index:1}
.rail .dot{display:block;width:8px;height:8px;border-radius:50%;background:rgba(14,27,43,.18);transition:background .3s}
.rail a:hover .dot{background:rgba(14,27,43,.4)}
 @media (max-width:820px){
  body.cine .tool{height:170vh}
  body.cine .tool-in{gap:18px}
  body.cine .vwrap{max-width:min(380px,40vh);width:100%}
  body.cine .tool h2{font-size:clamp(30px,8vw,44px);margin:6px 0 10px}
  body.cine .tool p{font-size:15px}
  body.cine .tool .btn{margin-top:16px}
  body.cine .rail{right:4px;padding:10px 7px}
  .rail .pill{left:7px!important;top:10px!important}
}
.rail .pill{position:absolute;left:9px;top:12px;width:8px;height:22px;border-radius:4px;background:var(--azul);z-index:2;pointer-events:none;will-change:transform}
.rail .bar-p{display:none}

/* animaciones de dibujo */
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.8s cubic-bezier(.65,0,.35,1)}
.in .draw{stroke-dashoffset:0}
.bar{transform-origin:bottom;transform:scaleY(.05);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.in .bar{transform:scaleY(1)}
.lvl{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.in .lvl{opacity:1;transform:none}

/* reveal de texto (solo lo que está debajo del pliegue al cargar) */
.pre{opacity:0;transform:translateY(40px)}
.rv{transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}

/* GRID final */
.all{padding:140px 22px 120px;display:flex;flex-direction:column;align-items:center}
.all h3{font-size:clamp(34px,4.6vw,56px);font-weight:700;letter-spacing:-.04em;text-align:center;line-height:1.05}
.all .sub{color:var(--muted);font-size:19px;margin-top:14px;text-align:center}
.grid{margin-top:56px;width:min(1024px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:24px;padding:30px 28px;min-height:200px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 1px 0 var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 30px 60px -25px rgba(14,27,43,.3)}
.card .k{font-size:12px;font-weight:600;color:var(--naranja);letter-spacing:.06em;text-transform:uppercase}
.card h4{font-size:24px;font-weight:700;letter-spacing:-.03em}
.card p{color:var(--muted);font-size:14px;line-height:1.45}
.card .go{margin-top:auto;color:var(--azul);font-weight:600;font-size:14px}
footer{border-top:1px solid var(--line);padding:26px 22px 40px;text-align:center;font-size:12px;color:var(--muted)}
footer code{font-family:ui-monospace,Menlo,monospace;background:var(--tile);padding:2px 6px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .pre{opacity:1;transform:none}.draw{stroke-dashoffset:0}.bar{transform:none}.lvl{opacity:1;transform:none}.fade{opacity:1}.pop{transform:none}
  .hero{height:auto}.hero-stick{position:relative;height:auto;min-height:88vh}
}
body.cine .k2,body.cine .k3,body.cine .k4,body.cine .k5{transition:none}
body.cine .btn.k5{transition:background .2s}

/* ===== CELULAR: animaciones por tiempo en el compositor (fluidas a 60/120 Hz) ===== */
body.movil .tool{min-height:auto;padding:76px 20px}
body.movil .vwrap{opacity:0;transform:perspective(1200px) translate3d(0,64px,0) rotateX(20deg) scale(.88);
  transition:transform 1.15s cubic-bezier(.16,1,.3,1) .12s,opacity .8s ease .12s;will-change:transform,opacity;backface-visibility:hidden}
body.movil .k2,body.movil .k3,body.movil .k4,body.movil .k5{opacity:0;transform:translate3d(0,22px,0);
  transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .7s ease;will-change:transform,opacity}
body.movil .k3{transition-delay:.07s}body.movil .k4{transition-delay:.14s}body.movil .k5{transition-delay:.2s}
body.movil .tool.vivo .vwrap,body.movil .tool.vivo .k2,body.movil .tool.vivo .k3,body.movil .tool.vivo .k4,body.movil .tool.vivo .k5{opacity:1;transform:none}
body.movil .vis{box-shadow:0 18px 40px -22px rgba(14,27,43,.28)}
body.movil .vis::after{display:none}
body.movil .rail{display:flex;position:fixed;right:6px;top:50%;transform:translateY(-50%);flex-direction:column;gap:14px;z-index:40;
  padding:10px 7px;border-radius:999px;background:rgba(251,251,253,.9);box-shadow:0 0 0 1px rgba(14,27,43,.06);opacity:0;transition:opacity .4s;pointer-events:none}
body.movil .rail.on{opacity:1;pointer-events:auto}
body.movil .rail .pill{left:7px;top:10px;transition:transform .55s cubic-bezier(.16,1,.3,1)}

html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
</style>
</head>

const FUENTES=["https://raw.githubusercontent.com/333avicola-byte/333Recursos-Humanos/main/README.md","README.md"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const limpiar=s=>String(s||"").replace(/\*\*/g,"").trim();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function deReadme(txt){
  const out=[]; let cols=null, ok=false;
  for(const l of txt.split(/\r?\n/)){
    if(!l.trim().startsWith("|")){cols=null;ok=false;continue;}
    const c=l.split("|").slice(1,-1).map(x=>x.trim());
    if(!cols){cols=c.map(x=>limpiar(x).toLowerCase());ok=cols.some(x=>x.startsWith("herramienta"));continue;}
    if(/^:?-{2,}/.test(c[0]||"")||!ok) continue;
    const ix=n=>cols.findIndex(x=>x.startsWith(n));
    const md=(c[ix("link")]||"").match(/\[([^\]]*)\]\(([^)]+)\)/);
    let href=md?md[2]:limpiar(c[ix("link")]); href=href.replace(/^.*333Recursos-Humanos\//,"").replace(/^\//,"");
    if(!href) continue;
    out.push({nombre:limpiar(c[ix("herramienta")]),link:href,desc:ix("descrip")>-1?limpiar(c[ix("descrip")]):"",fuente:ix("datos")>-1?limpiar(c[ix("datos")]):""});
  }
  return out.filter(h=>h.nombre);
}

      b+=`<g class="lvl" style="transition-delay:${i*140}ms">

function pintar(lista){
  document.getElementById("navlinks").innerHTML=lista.map(h=>`<a href="${esc(h.link)}">${esc(h.nombre)}</a>`).join("");
  document.getElementById("tools").innerHTML=lista.map((h,i)=>`
    <section class="tool" data-i="${i}" id="ind-${i+1}">
      <div class="stage">
        <div class="halo" aria-hidden="true"></div>
        <div class="tool-in">
          <div class="txt rv">
            <h2 class="k2">${esc(h.nombre)}</h2>
            ${h.desc?`<p class="k3">${esc(h.desc)}</p>`:""}
            ${h.fuente?`<div class="src k4">${esc(h.fuente)}</div>`:""}
            <a class="btn pri k5" href="${esc(h.link)}">Abrir ›</a>
          </div>
          <div class="vwrap"><a class="vis" href="${esc(h.link)}" aria-label="Abrir ${esc(h.nombre)}">${visual(h)}</a></div>
        </div>
      </div>
    </section>`).join("");
  document.getElementById("rail").innerHTML=lista.map((h,i)=>`<a href="#ind-${i+1}" data-i="${i}" aria-label="${esc(h.nombre)}"><span class="dot"></span></a>`).join("")+`<span class="pill" aria-hidden="true"></span>`;
  animar();
}

/* reveals: solo prepara lo que está debajo del pliegue; lo visible queda quieto */
let io;
function animar(){
  if(io) io.disconnect();
  if(!reduce){ modo(); bindTilt(); return; }
  const els=[...document.querySelectorAll(".rv, .tool")];
  if(reduce||!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.18});
  els.forEach(e=>{ const r=e.getBoundingClientRect();
    if(r.top<innerHeight*.9){ e.classList.add("in"); return; }
    if(e.classList.contains("rv")) e.classList.add("pre");
    io.observe(e); });
  bindTilt();
}
function bindTilt(){
  document.querySelectorAll(".vis").forEach(v=>{
    v.addEventListener("pointermove",ev=>{ if(ev.pointerType!=="mouse") return; const r=v.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width-.5, y=(ev.clientY-r.top)/r.height-.5;
      v.style.transform=`perspective(900px) rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.02)`; });
    v.addEventListener("pointerleave",()=>{ v.style.transform=""; });
  });
}


/* ===== ESCENAS: cada indicador entra, se sostiene y sale con el scroll ===== */
const cineMQ=matchMedia("(hover: hover) and (pointer: fine)");
const cl=(x)=>Math.min(1,Math.max(0,x));
const ez=(x)=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function cineOn(){ return !reduce && cineMQ.matches; }
let lenis=null, C=[], pillY=null, pillT=0, pillRun=false, ultT=0;
function initLenis(){
  if(reduce||lenis||!window.Lenis) return;
  lenis=new Lenis({duration:1.25,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t)),smoothWheel:true,wheelMultiplier:.9,touchMultiplier:1.4});
  const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)}; requestAnimationFrame(raf);
  lenis.on("scroll",()=>{escenas();onScroll();});
}
function medir(){
  const tools=[...document.querySelectorAll(".tool")];
  C=tools.map((t,i)=>({t,v:t.querySelector(".vwrap"),halo:t.querySelector(".halo"),
    ks:["k2","k3","k4","k5"].map(k=>t.querySelector("."+k)).filter(Boolean),
    top:t.getBoundingClientRect().top+scrollY,h:t.offsetHeight,izq:i%2===0,last:i===tools.length-1}));
}
function pintarEscena(o,a,p){
  const ent=ez(cl((a-.12)/1.0)), ext=o.last?0:ez(cl((p-.86)/.14))*.55;
  const s=.72+.28*ent-.1*ext, rx=26*(1-ent), ry=(o.izq?-14:14)*(1-ent);
  o.v.style.transform=`perspective(1600px) translate3d(0,${(110*(1-ent)-60*ext).toFixed(2)}px,0) rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  o.v.style.opacity=(Math.min(1,ent*1.4)*(1-ext)).toFixed(3);
  o.ks.forEach((e,j)=>{ const q=ez(cl((a-.35-j*.07)/.8));
    e.style.transform=`translate3d(${((o.izq?60:-60)*(1-q)).toFixed(2)}px,${(-36*ext).toFixed(2)}px,0)`;
    e.style.opacity=(q*(1-ext)).toFixed(3); });
  if(o.halo) o.halo.style.opacity=(ent*(1-ext)).toFixed(3);
  if(a>.75&&!o.t.classList.contains("in")) o.t.classList.add("in");
}
function escenas(){
  if(!document.body.classList.contains("cine")||!C.length) return;
  const y=lenis?lenis.scroll:scrollY, vh=innerHeight; let f=-1;
  C.forEach((o,i)=>{
    const rt=o.top-y, total=Math.max(1,o.h-vh);
    if(rt>vh*1.3||rt+o.h<-vh*.3) return;
    const p=cl(-rt/total), a=(vh-rt)/vh;
    pintarEscena(o,a,p);
    if(a>=.5&&rt+o.h>vh*.5) f=i+(o.last?0:ez(cl((p-.8)/.2))*.999);
  });
  const rail=document.getElementById("rail"); rail.classList.toggle("on",f>=0);
  if(f>=0){ pillT=Math.min(f,C.length-1)*22; if(pillY===null) pillY=pillT;
    const act=Math.round(Math.min(f,C.length-1)); rail.querySelectorAll("a").forEach(a=>a.classList.toggle("act",+a.dataset.i===act));
    if(!pillRun){pillRun=true;ultT=performance.now();requestAnimationFrame(pildora);} }
}
function pildora(now){
  const pill=document.querySelector("#rail .pill"); if(!pill){pillRun=false;return;}
  const dt=Math.min(64,now-ultT); ultT=now;
  const k=1-Math.exp(-dt/90);               // suavizado independiente de los fps
  const d=pillT-pillY; pillY+=d*k;
  const estira=1+Math.min(1,Math.abs(d)/12)*.9;
  pill.style.transform=`translate3d(0,${(pillY-7).toFixed(2)}px,0) scaleY(${estira.toFixed(3)})`;
  if(Math.abs(d)>.05) requestAnimationFrame(pildora); else {pill.style.transform=`translate3d(0,${(pillT-7).toFixed(2)}px,0)`;pillRun=false;}
}
let ioM=null, railRaf=0;
function modo(){
  const on=cineOn(), mov=!reduce&&!on;
  document.body.classList.toggle("cine",on); document.body.classList.toggle("movil",mov);
  document.querySelectorAll(".tool").forEach(t=>{
    t.querySelectorAll(".vwrap,.k2,.k3,.k4,.k5").forEach(e=>{e.style.transform="";e.style.opacity="";});
    if(on||mov){ t.querySelectorAll(".rv").forEach(e=>e.classList.remove("pre")); }
  });
  if(on){ initLenis(); medir(); escenas(); }
  if(mov) movil();
}
function movil(){
  if(ioM) ioM.disconnect();
  ioM=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("vivo","in"); ioM.unobserve(e.target);} }),{threshold:.22,rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".tool").forEach(t=>ioM.observe(t));
  railMovil();
}
function railMovil(){
  railRaf=0; if(!document.body.classList.contains("movil")) return;
  const tools=[...document.querySelectorAll(".tool")], vh=innerHeight, rail=document.getElementById("rail"), pill=rail.querySelector(".pill");
  let act=-1; tools.forEach((t,i)=>{ const r=t.getBoundingClientRect(); if(r.top<vh*.55&&r.bottom>vh*.45) act=i; });
  if(act<0&&tools[0]&&tools[0].getBoundingClientRect().top<vh*.55) act=tools.length-1;
  rail.classList.toggle("on",act>=0);
  if(act>=0&&pill){ pill.style.transform=`translate3d(0,${act*22-7}px,0)`; rail.querySelectorAll("a").forEach(a=>a.classList.toggle("act",+a.dataset.i===act)); }
}
addEventListener("scroll",()=>{ if(document.body.classList.contains("movil")&&!railRaf) railRaf=requestAnimationFrame(railMovil); },{passive:true});
function irA(y){ lenis?lenis.scrollTo(y,{duration:1.6}):scrollTo({top:y,behavior:"smooth"}); }
addEventListener("scroll",()=>{ if(!lenis) requestAnimationFrame(escenas); },{passive:true});
addEventListener("resize",()=>requestAnimationFrame(modo));
addEventListener("load",()=>{medir();escenas();});
document.fonts&&document.fonts.ready.then(()=>{medir();escenas();});
document.addEventListener("click",e=>{
  const a=e.target.closest(".rail a, a[href^='#']"); if(!a) return;
  if(document.body.classList.contains("movil")&&a.closest(".rail")){ const t=document.querySelectorAll(".tool")[+a.dataset.i]; if(t){ e.preventDefault(); t.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  if(!document.body.classList.contains("cine")) return;
  let y=null;
  if(a.closest(".rail")){ const o=C[+a.dataset.i]; if(o) y=o.top+(o.h-innerHeight)*.35; }
  else { const el=document.querySelector(a.getAttribute("href")); if(el){ const o=C.find(c=>c.t===el); y=o?o.top+(o.h-innerHeight)*.35:el.getBoundingClientRect().top+scrollY; } }
  if(y!==null){ e.preventDefault(); irA(y); }
});

/* hero: se achica y se desvanece al scrollear, estilo keynote */
const hero=document.getElementById("hero"), ht=document.getElementById("heroTxt"), orb=document.getElementById("orb");
function onScroll(){
  if(reduce||document.body.classList.contains("movil")) return;
  const p=Math.min(1,Math.max(0,scrollY/(hero.offsetHeight-innerHeight)));
  ht.style.transform=`scale(${1-p*.18}) translateY(${-p*40}px)`;
  ht.style.opacity=String(1-p*0.85);
  orb.style.transform=`translate(${p*-8}vw,${p*10}vh) scale(${1+p*.4})`;
}
addEventListener("scroll",()=>requestAnimationFrame(onScroll),{passive:true});

pintar(POR_DEFECTO);
(async()=>{ for(const u of FUENTES){ try{
  const r=await fetch(u+"?v="+Date.now()); if(!r.ok) continue;
  const l=deReadme(await r.text()); if(l.length){ pintar(l); return; } }catch(e){} } })();
})();
