<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI 333</title>
<meta name="description" content="KPI 333 · Tableros de Recursos Humanos de 333">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --azul:#1F6DB1; --azul-2:#2D85D1; --claro:#D1E3F6; --naranja:#E87722; --verde:#8CC63F; --gris:#53565A;
  --ink:#0E1B2B; --muted:#6B7480; --bg:#FBFBFD; --tile:#F2F5F9; --line:rgba(14,27,43,.08);
  --f:"Montserrat",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--azul-2);outline-offset:3px;border-radius:12px}

/* ===== NAV vidrio ===== */
nav{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;justify-content:center;
  background:rgba(251,251,253,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.nav-in{width:min(1120px,100%);padding:0 22px;display:flex;align-items:center;gap:14px}
.nav-in img{height:26px;width:auto;display:block}
.nav-in .t{font-weight:700;font-size:14px;letter-spacing:-.01em;margin-right:auto}
.nav-in .links{display:flex;gap:24px;font-size:12px;color:var(--muted)}
.nav-in .links a{transition:color .2s}.nav-in .links a:hover{color:var(--ink)}
@media (max-width:760px){.nav-in .links{display:none}}

/* ===== PORTADA: título + accesos directos a los 4 tableros ===== */
.hero{position:relative;height:calc(100svh + 30vh)}
.hero-stick{position:sticky;top:52px;min-height:calc(100svh - 52px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px 56px;overflow:hidden}
.orb{position:absolute;left:50%;top:40%;width:70vmax;height:70vmax;margin:-35vmax 0 0 -35vmax;border-radius:50%;z-index:-1;pointer-events:none;
  filter:blur(60px);opacity:.6;background:radial-gradient(circle at 30% 30%,var(--claro),transparent 60%),radial-gradient(circle at 70% 70%,rgba(45,133,209,.22),transparent 55%)}
.hero-in{width:min(1120px,100%);display:flex;flex-direction:column;align-items:center}
.head{text-align:center}
.eyebrow{font-size:13px;font-weight:600;color:var(--naranja);letter-spacing:.04em;margin-bottom:10px}
.hero h1{font-size:clamp(46px,7.4vw,96px);font-weight:800;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(180deg,var(--ink) 30%,#3a4b60);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 span{background:linear-gradient(90deg,var(--azul),var(--azul-2) 60%,#63A6E0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin-top:14px;font-size:clamp(15px,1.6vw,19px);color:var(--muted);letter-spacing:-.01em}

.tiles{margin-top:clamp(26px,4.5vh,48px);width:min(1120px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:28px;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 20px 50px -30px rgba(14,27,43,.35);
  transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.tile .mini{aspect-ratio:5/4;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 20% 10%,#EAF2FB 0%,#F7FAFD 55%,#fff 100%)}
.tile .mini svg{width:82%;height:auto;max-height:96%;overflow:visible}
.tile .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile .n{font-size:11px;font-weight:700;color:var(--naranja);letter-spacing:.08em;text-transform:uppercase}
.tile h2{font-size:clamp(17px,1.5vw,21px);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.tile p{font-size:13px;color:var(--muted);line-height:1.4}
.tile .go{margin-top:auto;padding-top:10px;font-size:14px;font-weight:600;color:var(--azul);display:inline-flex;align-items:center;gap:6px}
.tile .go i{font-style:normal;transition:transform .35s var(--ease)}
@media (hover:hover){
  .tile:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 1px 0 var(--line),0 34px 70px -30px rgba(14,27,43,.4)}
  .tile:hover .go i{transform:translateX(4px)}
}
.tile:active{transform:scale(.985)}
.scroll-cue{margin-top:clamp(18px,3.5vh,34px);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.scroll-cue::after{content:"";display:block;margin:8px auto 0;width:1px;height:26px;background:linear-gradient(var(--muted),transparent);animation:cue 2s infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* entrada de la portada (por tiempo: igual en todos los navegadores) */
.enter{animation:enter 1s var(--ease) backwards}
.head.enter{animation-delay:.05s}
.tile.enter:nth-child(1){animation-delay:.18s}.tile.enter:nth-child(2){animation-delay:.26s}
.tile.enter:nth-child(3){animation-delay:.34s}.tile.enter:nth-child(4){animation-delay:.42s}
.scroll-cue.enter{animation-delay:.7s}
@keyframes enter{from{opacity:0;transform:translate3d(0,28px,0)}}

@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));max-width:680px}}
@media (max-width:560px){
  .hero-stick{padding:22px 16px 40px}
  .tiles{gap:12px}
  .tile{border-radius:22px}
  .tile .mini{aspect-ratio:4/3}
  .tile .body{padding:12px 14px 14px}
  .tile p{display:none}
  .tile .go{padding-top:6px;font-size:13px}
}
/* pantallas bajas: la portada deja de ser fija para que siempre entren los 4 accesos */
@media (max-height:700px),(max-width:560px){.hero{height:auto}.hero-stick{position:relative;top:0;min-height:0}}

/* ===== ESCENAS por indicador (efecto Apple) ===== */
.tool{position:relative;display:flex;align-items:center;justify-content:center;padding:110px 22px}
.tool:nth-of-type(even){background:var(--tile)}
.stage{width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.tool-in{width:min(1024px,100%);display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.vwrap{width:100%}
.tool:nth-of-type(odd) .vwrap{order:-1}
.halo{display:none}
.num{font-size:13px;font-weight:700;color:var(--naranja);letter-spacing:.08em;text-transform:uppercase}
.tool h3{font-size:clamp(36px,5.2vw,66px);font-weight:700;letter-spacing:-.04em;line-height:1.03;margin:10px 0 18px}
.tool p{font-size:clamp(16px,1.6vw,21px);color:var(--muted);line-height:1.45;max-width:34ch;letter-spacing:-.01em}
.tool .src{margin-top:18px;font-size:12px;font-weight:600;color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;margin-top:28px;padding:12px 22px;border-radius:980px;font-size:15px;font-weight:600;
  background:var(--azul);color:#fff;transition:background .2s,transform .2s}
@media (hover:hover){.btn:hover{background:#185a93;transform:scale(1.03)}}
.vis{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:32px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 20% 10%,#EAF2FB 0%,#F7FAFD 55%,#fff 100%);box-shadow:0 30px 60px -30px rgba(14,27,43,.28);
  transition:transform .5s var(--ease)}
.vis::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(31,109,177,.08);pointer-events:none}
.vis svg{width:88%;height:auto;overflow:visible}
@media (max-width:820px){
  .tool{padding:80px 20px}
  .tool-in{grid-template-columns:1fr;gap:30px}
  .tool:nth-of-type(odd) .vwrap{order:0}
  .vwrap{max-width:440px;justify-self:center}
  .vis{border-radius:26px}
  .tool p{max-width:none}
}

/* A) Navegadores con animación ligada al scroll: escena fija que entra, se queda y se va */
@supports (animation-timeline: view()){
@media (prefers-reduced-motion:no-preference) and (min-height:600px){
  .sda .tool{display:block;height:190vh;padding:0;background:transparent!important;view-timeline-name:--esc;view-timeline-axis:block}
  .sda .stage{position:sticky;top:52px;height:calc(100svh - 52px);padding:0 22px;overflow:hidden}
  .sda .halo{display:block;position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;
    background:radial-gradient(70% 60% at 72% 45%,#E4EFFA 0%,rgba(228,239,250,0) 70%);animation:haloK linear both;animation-timeline:--esc}
  .sda .tool:nth-of-type(odd) .halo{background:radial-gradient(70% 60% at 28% 45%,#E4EFFA 0%,rgba(228,239,250,0) 70%)}
  .sda .vwrap{animation:visK linear both;animation-timeline:--esc;will-change:transform,opacity}
  .sda .tool:nth-of-type(odd) .vwrap{animation-name:visKi}
  .sda .k{animation:txtK linear both;animation-timeline:--esc}
  .sda .tool:nth-of-type(odd) .k{animation-name:txtKi}
  .sda .k.d1{animation-range:cover 2% cover 100%}.sda .k.d2{animation-range:cover 4% cover 100%}
  .sda .k.d3{animation-range:cover 6% cover 100%}.sda .k.d4{animation-range:cover 8% cover 100%}
  .sda .tool:last-of-type .vwrap{animation-name:visKf}
  .sda .tool:last-of-type:nth-of-type(odd) .vwrap{animation-name:visKfi}
  .sda .tool:last-of-type .k{animation-name:txtKf}
  .sda .tool:last-of-type:nth-of-type(odd) .k{animation-name:txtKfi}
  .sda .tool:last-of-type .halo{animation-name:haloKf}
  @media (min-width:561px) and (min-height:701px){
    .sda .hero .hero-in{animation:heroK linear both;animation-timeline:scroll(root);animation-range:0 90vh}
    .sda .orb{animation:orbK linear both;animation-timeline:scroll(root);animation-range:0 90vh}
  }
  @media (max-width:820px){
    .sda .tool-in{gap:16px}
    .sda .vwrap{max-width:min(360px,38vh)}
    .sda .tool h3{font-size:clamp(28px,8vw,42px);margin:6px 0 8px}
    .sda .tool p{font-size:15px}
    .sda .btn{margin-top:14px}
  }
}}
/* tramo de cada escena (190vh): 0-34% entra mientras sube · 34-65% queda fija · se funde antes de soltarse */
@keyframes visK {0%{opacity:0;transform:perspective(1600px) translate3d(0,120px,0) rotateX(26deg) rotateY(14deg) scale(.74)}
  33%,54%{opacity:1;transform:perspective(1600px) translate3d(0,0,0) rotateX(0) rotateY(0) scale(1)}
  64%,100%{opacity:0;transform:perspective(1600px) translate3d(0,-80px,0) rotateX(-8deg) scale(.9)}}
@keyframes visKi{0%{opacity:0;transform:perspective(1600px) translate3d(0,120px,0) rotateX(26deg) rotateY(-14deg) scale(.74)}
  33%,54%{opacity:1;transform:perspective(1600px) translate3d(0,0,0) rotateX(0) rotateY(0) scale(1)}
  64%,100%{opacity:0;transform:perspective(1600px) translate3d(0,-80px,0) rotateX(-8deg) scale(.9)}}
@keyframes visKf{0%{opacity:0;transform:perspective(1600px) translate3d(0,120px,0) rotateX(26deg) rotateY(14deg) scale(.74)}33%,100%{opacity:1;transform:none}}
@keyframes visKfi{0%{opacity:0;transform:perspective(1600px) translate3d(0,120px,0) rotateX(26deg) rotateY(-14deg) scale(.74)}33%,100%{opacity:1;transform:none}}
@keyframes txtK {0%,12%{opacity:0;transform:translate3d(-60px,0,0)}34%,54%{opacity:1;transform:none}62%,100%{opacity:0;transform:translate3d(0,-40px,0)}}
@keyframes txtKi{0%,12%{opacity:0;transform:translate3d(60px,0,0)}34%,54%{opacity:1;transform:none}62%,100%{opacity:0;transform:translate3d(0,-40px,0)}}
@keyframes txtKf {0%,12%{opacity:0;transform:translate3d(-60px,0,0)}34%,100%{opacity:1;transform:none}}
@keyframes txtKfi{0%,12%{opacity:0;transform:translate3d(60px,0,0)}34%,100%{opacity:1;transform:none}}
@keyframes haloK{0%{opacity:0}33%,54%{opacity:1}64%,100%{opacity:0}}
@keyframes haloKf{0%{opacity:0}33%,100%{opacity:1}}
@keyframes heroK{to{transform:scale(.9) translateY(-30px);opacity:.15}}
@keyframes orbK{to{transform:translate(-8vw,10vh) scale(1.35)}}

/* B) Resto de navegadores: cada escena aparece una vez, por tiempo */
.rev .vwrap{opacity:0;transform:perspective(1400px) translate3d(0,70px,0) rotateX(20deg) scale(.88);transition:transform 1.2s var(--ease) .1s,opacity .8s ease .1s}
.rev .k{opacity:0;transform:translate3d(0,24px,0);transition:transform .95s var(--ease),opacity .7s ease}
.rev .k.d2{transition-delay:.07s}.rev .k.d3{transition-delay:.14s}.rev .k.d4{transition-delay:.2s}
.rev .tool.vivo .vwrap,.rev .tool.vivo .k{opacity:1;transform:none}

/* dibujos dentro de las ilustraciones */
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.8s cubic-bezier(.65,0,.35,1)}
.in .draw{stroke-dashoffset:0}
.lvl{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.in .lvl{opacity:1;transform:none}
.fade{opacity:0;transition:opacity 1.4s .6s}.in .fade{opacity:1}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s 1.4s cubic-bezier(.3,1.6,.5,1)}.in .pop{transform:scale(1)}
.float{animation:flt 6s ease-in-out infinite}.float.d2{animation-delay:-3s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pausa .float{animation-play-state:paused}

/* riel de puntitos */
.rail{display:flex;position:fixed;right:18px;top:50%;transform:translateY(-50%);flex-direction:column;gap:14px;z-index:40;
  padding:12px 9px;border-radius:999px;background:rgba(251,251,253,.92);box-shadow:0 0 0 1px rgba(14,27,43,.07),0 8px 24px -12px rgba(14,27,43,.25);
  opacity:0;transition:opacity .4s ease;pointer-events:none}
.rail.on{opacity:1;pointer-events:auto}
.rail a{display:block;width:8px;height:8px;border-radius:50%;background:rgba(14,27,43,.18);transition:background .3s,transform .3s}
.rail a.act{background:var(--azul);transform:scale(1.35)}
@media (max-width:820px){.rail{right:6px;padding:10px 7px}}

footer{border-top:1px solid var(--line);padding:26px 22px calc(40px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .draw{stroke-dashoffset:0}.lvl,.fade{opacity:1;transform:none}.pop{transform:none}
  .hero{height:auto}.hero-stick{position:relative;top:0}
}
</style>
</head>

const README="https://raw.githubusercontent.com/333avicola-byte/333Recursos-Humanos/main/README.md";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const limpiar=s=>String(s||"").replace(/\*\*/g,"").trim();
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const SDA=!!(window.CSS&&CSS.supports&&CSS.supports("animation-timeline: view()"));

function deReadme(txt){
  const out=[]; let cols=null, ok=false;
  for(const l of txt.split(/\r?\n/)){
    if(!l.trim().startsWith("|")){cols=null;ok=false;continue;}
    const c=l.split("|").slice(1,-1).map(x=>x.trim());
    if(!cols){cols=c.map(x=>limpiar(x).toLowerCase());ok=cols.some(x=>x.startsWith("herramienta"));continue;}
    if(/^:?-{2,}/.test(c[0]||"")||!ok) continue;
    const ix=n=>cols.findIndex(x=>x.startsWith(n));
    const md=(c[ix("link")]||"").match(/\[([^\]]*)\]\(([^)]+)\)/);
    let href=md?md[2]:limpiar(c[ix("link")]); href=href.replace(/^.*333Recursos-Humanos\//,"").replace(/^\//,"");
    if(!href) continue;
    out.push({nombre:limpiar(c[ix("herramienta")]),link:href,desc:ix("descrip")>-1?limpiar(c[ix("descrip")]):"",fuente:ix("datos")>-1?limpiar(c[ix("datos")]):""});
  }
  return out.filter(h=>h.nombre);
}

      <circle cx="200" cy="200" r="132" fill="#fff" filter="url(#sh${u})"/>

      ${gente}
      <text x="200" y="196" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#0E1B2B">Equipo</text>
      <text x="200" y="220" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#53565A" letter-spacing="1.5">ALTAS · BAJAS</text>
      ${flujo("M20 120 Q90 110 150 150","#8CC63F",3.2,0)}${flujo("M30 290 Q100 300 150 250","#8CC63F",3.2,1.6)}
      ${flujo("M250 150 Q320 110 385 118","#E87722",3.6,.8)}
      <g class="float" filter="url(#sh${u})"><rect x="16" y="330" width="112" height="44" rx="14" fill="#fff"/><circle cx="38" cy="352" r="7" fill="#8CC63F"/><text x="52" y="357" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E1B2B">Altas</text></g>
      <g class="float d2" filter="url(#sh${u})"><rect x="272" y="26" width="112" height="44" rx="14" fill="#fff"/><circle cx="294" cy="48" r="7" fill="#E87722"/><text x="308" y="53" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E1B2B">Bajas</text></g>

  if(k.includes("piram")||k.includes("jerarq")){
    const top=["#4F93D3","#5AA0DF","#F09A55","#F8BD86","#A9D86C"], side=["#1F6DB1","#2D85D1","#E87722","#F5A35C","#8CC63F"];

        <polygon points="${200-w},${y} ${200+w},${y} ${200+w2},${y+h} ${200-w2},${y+h}" fill="${side[i]}"/>
        <polygon points="${200-w},${y} ${200+w},${y} ${200+w-6},${y+8} ${200-w+6},${y+8}" fill="${top[i]}"/>
        <text x="200" y="${y+27}" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="${[10,12,13,13,14][i]}" font-weight="800" fill="#fff" letter-spacing="1">${nombres[i]}</text></g>`; }
    return `<svg viewBox="0 0 400 400" role="img" aria-label="Ilustración pirámide">${defs}
      <ellipse cx="200" cy="352" rx="170" ry="16" fill="#0E1B2B" opacity=".07"/>${s}</svg>`;
  }
  if(k.includes("futuro")||k.includes("teambuilding")){
    const filas=[["Visión",236,250],["Unidad",240,262],["Composición",214,206],["Compromiso",270,276]];
    let b="";
    filas.forEach(([n,a,c],i)=>{const y=132+i*50;
      b+=`<g class="lvl" style="transition-delay:${i*140}ms">
        <text x="68" y="${y+14}" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#53565A">${n}</text>
        <rect x="150" y="${y}" width="${a-80}" height="11" rx="5.5" fill="#D1E3F6"/>
        <rect x="150" y="${y+14}" width="${c-80}" height="11" rx="5.5" fill="${c<a?"#E87722":"#1F6DB1"}"/></g>`;});
    return `<svg viewBox="0 0 400 400" role="img" aria-label="Ilustración Equipo con Futuro">${defs}
      <rect x="40" y="70" width="320" height="270" rx="26" fill="#fff" filter="url(#sh${u})"/>
      <text x="68" y="110" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#53565A" letter-spacing="1.5">EQUIPO CON FUTURO</text>

        <rect x="254" y="52" width="10" height="20" rx="3" fill="#D1E3F6"/><rect x="268" y="46" width="10" height="26" rx="3" fill="#1F6DB1"/>
        <text x="288" y="68" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0E1B2B">6 meses</text></g>

        <path d="M40 348 L54 334 L64 342 L80 326" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

let observadores=[];
function pintar(lista){
  observadores.forEach(o=>o.disconnect()); observadores=[];
  document.getElementById("navlinks").innerHTML=lista.map(h=>`<a href="${esc(h.link)}">${esc(h.nombre)}</a>`).join("");
  document.getElementById("tiles").innerHTML=lista.map((h,i)=>`
    <a class="tile enter" href="${esc(h.link)}">
      <div class="mini" aria-hidden="true">${visual(h,"t"+i)}</div>
      <div class="body">
        <span class="n">${String(i+1).padStart(2,"0")}</span>
        <h2>${esc(h.nombre)}</h2>
        ${h.desc?`<p>${esc(h.desc)}</p>`:""}
        <span class="go">Abrir <i>›</i></span>
      </div>
    </a>`).join("");
  document.getElementById("tools").innerHTML=lista.map((h,i)=>`
    <section class="tool" id="ind-${i+1}" data-i="${i}">
      <div class="stage">
        <div class="halo" aria-hidden="true"></div>
        <div class="tool-in">
          <div class="txt">
            <div class="num k d1">Indicador ${String(i+1).padStart(2,"0")}</div>
            <h3 class="k d2">${esc(h.nombre)}</h3>
            ${h.desc?`<p class="k d3">${esc(h.desc)}</p>`:""}
            ${h.fuente?`<div class="src k d3">${esc(h.fuente)}</div>`:""}
            <a class="btn k d4" href="${esc(h.link)}">Abrir tablero ›</a>
          </div>
          <div class="vwrap"><a class="vis" href="${esc(h.link)}" aria-label="Abrir ${esc(h.nombre)}">${visual(h,"s"+i)}</a></div>
        </div>
      </div>
    </section>`).join("");
  document.getElementById("rail").innerHTML=lista.map((h,i)=>`<a href="#ind-${i+1}" data-i="${i}" aria-label="${esc(h.nombre)}"></a>`).join("");
  animar();
}

function animar(){
  const tiles=document.getElementById("tiles");
  if(REDUCE||!("IntersectionObserver" in window)){
    document.querySelectorAll(".tool,.tile").forEach(e=>e.classList.add("in","vivo")); return;
  }
  // accesos directos: dibujan su ilustración apenas entran
  setTimeout(()=>tiles.querySelectorAll(".tile").forEach(t=>t.classList.add("in")),450);
  const tools=[...document.querySelectorAll(".tool")];
  const ioV=new IntersectionObserver(es=>es.forEach(e=>{
    e.target.classList.toggle("pausa",!e.isIntersecting);
    if(e.isIntersecting&&e.intersectionRatio>=.15) e.target.classList.add("in","vivo");
  }),{threshold:[0,.15]});
  const ioR=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) activar(+e.target.dataset.i); }),{rootMargin:"-49% 0px -49% 0px"});
  const ioM=new IntersectionObserver(es=>es.forEach(e=>document.getElementById("rail").classList.toggle("on",e.isIntersecting)),{rootMargin:"-45% 0px -45% 0px"});
  tools.forEach(t=>{ioV.observe(t);ioR.observe(t);});
  ioM.observe(document.getElementById("tools"));
  observadores.push(ioV,ioR,ioM);
}
function activar(i){ document.querySelectorAll("#rail a").forEach(a=>a.classList.toggle("act",+a.dataset.i===i)); }

/* inclinación suave al pasar el mouse sobre la ilustración */
document.addEventListener("pointermove",ev=>{
  if(ev.pointerType!=="mouse") return;
  const v=ev.target.closest&&ev.target.closest(".vis"); if(!v) return;
  const r=v.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width-.5, y=(ev.clientY-r.top)/r.height-.5;
  v.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg) scale(1.02)`;
},{passive:true});
document.addEventListener("pointerout",ev=>{ const v=ev.target.closest&&ev.target.closest(".vis"); if(v&&!v.contains(ev.relatedTarget)) v.style.transform=""; });

/* riel: lleva al momento en que la escena está quieta */
document.addEventListener("click",e=>{
  const a=e.target.closest("#rail a"); if(!a) return;
  const t=document.getElementById("ind-"+(+a.dataset.i+1)); if(!t) return;
  e.preventDefault();
  const top=t.getBoundingClientRect().top+scrollY;
  const fija=getComputedStyle(t.querySelector(".stage")).position==="sticky";
  scrollTo({top:fija?top+(t.offsetHeight+innerHeight)*.42-innerHeight:top-52,behavior:REDUCE?"auto":"smooth"});
});

document.body.classList.add(SDA&&!REDUCE?"sda":"rev");
pintar(POR_DEFECTO);

/* README: solo repinta si la lista cambió (así la portada no "salta" al cargar) */
const clave=l=>JSON.stringify(l.map(h=>[h.nombre,h.link,h.desc,h.fuente]));
fetch(README+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
  const l=t?deReadme(t):[]; if(l.length&&clave(l)!==clave(POR_DEFECTO)){ pintar(l); document.querySelectorAll(".enter").forEach(e=>e.classList.remove("enter")); }
}).catch(()=>{});
})();
</script>
